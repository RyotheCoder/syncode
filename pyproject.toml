[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncode"
version = "0.1.0"
description = "Syncode - CLI Swarm Agent powered by NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kidcode" }]
dependencies = [
    "rich>=13.0",
    "openai>=1.0",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
syncode = "syncode.cli:main"
kidagent = "syncode.cli:main"  # alias cu, giu tuong thich

[tool.setuptools.packages.find]
include = ["syncode*"]
